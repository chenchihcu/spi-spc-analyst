# 靜態單頁工具：不需建置，根目錄直接發布
[build]
  publish = "."
  command = ""

# 後端函式：/api/analyze（AI 分析，透過 Netlify AI Gateway 呼叫 Claude）、/api/share（分享連結，存於 Netlify Blobs，30 天失效）
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 首頁直接顯示分析台
[[redirects]]
  from = "/"
  to = "/spi-spc.html"
  status = 200

# 不對外提供開發用檔案（force：即使檔案存在也回 404）
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/lib/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# 安全標頭：內容安全政策（網站版只允許本站資源，不載入第三方 CDN；頁面內的 cdnjs 備援只在 claude.ai 等無本站檔案的環境使用）、禁止被嵌入、強制 HTTPS
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'"

# 本站函式庫與字型版本固定，可長期快取
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
